<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illia Ushanau — AI Creative Automation</title>
<meta name="description" content="Illia Ushanau — AI Creative Automation Engineer. Generative AI pipelines for image and video: ComfyUI, n8n, model APIs.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--bg2:#ebe9e3;--card:#fbfaf7;--ink:#1c1d1b;--muted:#5f645c;--faint:#a3a69d;--line:#dad9d0;--accent:#3d6b55;--accent2:#6f9a83;--accent-soft:#e2eae4;--navbg:rgba(244,243,239,.84);--shadow:0 1px 2px rgba(20,30,20,.05),0 10px 30px rgba(20,40,30,.07);--ht-bg:#f4f3ef;--ht-ink:#1d1f1c;
  --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;--sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111311;--bg2:#171a17;--card:#191c19;--ink:#e7eae4;--muted:#9ba196;--faint:#5e645b;--line:#2b302a;--accent:#8cc3a6;--accent2:#5f957a;--accent-soft:#1d2a22;--navbg:rgba(17,19,17,.82);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--ht-bg:#111311;--ht-ink:#e6e8e2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111311;--bg2:#171a17;--card:#191c19;--ink:#e7eae4;--muted:#9ba196;--faint:#5e645b;--line:#2b302a;--accent:#8cc3a6;--accent2:#5f957a;--accent-soft:#1d2a22;--navbg:rgba(17,19,17,.82);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--ht-bg:#111311;--ht-ink:#e6e8e2;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-underline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.label{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.label b{color:var(--accent);font-weight:500}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:var(--navbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:56px}
.logo{font:500 14px var(--mono);color:var(--ink);text-decoration:none}
.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 3px var(--accent-soft)}
.nav nav{display:flex;gap:18px;margin-left:auto}
.nav nav a{color:var(--muted);text-decoration:none;font:13px var(--mono);letter-spacing:.04em}
.nav nav a:hover{color:var(--ink)}
.tg{display:flex;gap:4px}
.tg button{font:12px var(--mono);letter-spacing:.06em;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:5px 9px;cursor:pointer}
.tg button.on{color:var(--accent);border-color:var(--accent)}
@media (max-width:760px){.nav nav{display:none}.tg{margin-left:auto}}

/* hero */
.hero{position:relative;overflow:hidden}
#dots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:56px}
@media (max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:40px;padding-top:36px}}
.hero h1{font-size:64px;line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:700}
.hero .say{font-size:27px;line-height:1.28;letter-spacing:-.015em;margin:18px 0 0;font-weight:500;max-width:600px}
.hero .say em{font-style:normal;color:var(--accent)}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}
.hero .sub span{font:12.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 9px;background:var(--card)}
@media (max-width:600px){.hero h1{font-size:44px}.hero .say{font-size:22px}}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 14.5px var(--sans);text-decoration:none;border-radius:8px;padding:10px 16px;border:1px solid var(--line);color:var(--ink);background:var(--card);cursor:pointer;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.avail{display:inline-flex;align-items:center;gap:8px;font:12.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 12px;background:var(--card)}
.avail i{width:7px;height:7px;border-radius:50%;background:#4caf7d;animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(76,175,125,.55)}70%{box-shadow:0 0 0 8px rgba(76,175,125,0)}100%{box-shadow:0 0 0 0 rgba(76,175,125,0)}}
.portrait{position:relative;justify-self:center;width:100%;max-width:400px}
.portrait .frame{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--ht-bg);cursor:crosshair}
.portrait canvas,.portrait img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.portrait img{filter:grayscale(1) contrast(1.1)}
.portrait .frame:hover img{filter:none}
.portrait .cap{display:flex;justify-content:space-between;white-space:nowrap;gap:10px;margin-top:10px;font:11.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.portrait .corner{position:absolute;width:14px;height:14px;border-color:var(--accent);border-style:solid;pointer-events:none}
.c1{top:-7px;left:-7px;border-width:1.5px 0 0 1.5px}.c2{top:-7px;right:-7px;border-width:1.5px 1.5px 0 0}.c3{bottom:22px;left:-7px;border-width:0 0 1.5px 1.5px}.c4{bottom:22px;right:-7px;border-width:0 1.5px 1.5px 0}
.portrait .ruler{position:absolute;left:0;right:0;top:-20px;height:8px;border-left:1px solid var(--faint);border-right:1px solid var(--faint);pointer-events:none}
.portrait .ruler::before{content:"";position:absolute;left:0;right:0;top:4px;border-top:1px solid var(--faint)}
.portrait .ruler span{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--bg);padding:0 6px;font:10px var(--mono);color:var(--muted)}

/* stats + marquee */
.stats{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:20px 16px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:28px;letter-spacing:-.02em;font-weight:600;line-height:1.1}
.stats span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:6px}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.stats div:nth-child(3){border-right:0}.stats div:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stats div{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}.stats div:nth-child(2n){border-right:0!important}}
.marq{overflow:hidden;border-bottom:1px solid var(--line);padding:12px 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq .tr{display:flex;width:max-content;animation:marq 60s linear infinite;font:13px var(--mono);color:var(--muted);letter-spacing:.04em}
.marq .tr span{padding:0 14px;white-space:nowrap}
.marq .tr span.s{color:var(--accent);padding:0}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
section{padding:84px 0 0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.sh h2{font-size:38px;letter-spacing:-.025em;line-height:1.1;margin:8px 0 0;font-weight:650}
.sh p{color:var(--muted);margin:0;font:12.5px var(--mono);letter-spacing:.04em}
@media (max-width:600px){.sh h2{font-size:30px}section{padding-top:64px}}

/* live pipeline */
.live{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.live .top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.live .top .d{display:flex;gap:5px}.live .top .d i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.live .top .sp{margin-left:auto}
.canvas{position:relative;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;background-color:var(--bg)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--faint);stroke-width:1.6;transition:stroke .25s,opacity .25s}
.wire.loop{stroke-dasharray:5 5}
.wire.hl{stroke:var(--accent);stroke-width:2.2}
.pulse{fill:var(--accent)}
.node{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);font:11px/1.4 var(--mono);user-select:none;-webkit-user-select:none;cursor:grab;transition:border-color .2s,opacity .25s,box-shadow .2s;touch-action:none}
.node:hover,.node.hl{border-color:var(--accent)}
.node.drag{cursor:grabbing;box-shadow:0 14px 34px rgba(0,0,0,.16);z-index:5;transition:none}
.stage.focus .node:not(.hl){opacity:.55}
.stage.focus .wire:not(.hl){opacity:.3}
.nh{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-bottom:1px solid var(--line);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;white-space:nowrap;overflow:hidden}
.nh b{color:var(--ink);font-weight:500}
.nh svg{width:13px;height:13px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.stage.nar .nh .st{display:none}
.stage.nar .row{font-size:10px;padding:3px 5px}
.nh .st{margin-left:auto;font-size:10px;color:var(--faint);text-transform:none;letter-spacing:0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.node.run .dot{background:#d9a441;animation:blink .6s infinite alternate}
.node.done .dot{background:var(--accent)}
.node.done .nh .st{color:var(--accent)}
@keyframes blink{to{opacity:.3}}
.port{position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:var(--card);border:1.6px solid var(--accent)}
.port.i{left:-6px}.port.o{right:-6px}
.nb{padding:9px 10px}
.row{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:4px;padding:3px 7px;margin:0 0 5px;background:var(--bg);color:var(--muted);white-space:nowrap}
.row b{color:var(--ink);font-weight:500}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.nimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block;pointer-events:none}
.nfoot{margin-top:7px;color:var(--faint);font-size:10px}
.wave{display:flex;align-items:center;gap:2px;height:38px}
.wave span{flex:1;background:var(--accent2);border-radius:1px;opacity:.85}
.node.run .wave span{animation:wv .5s infinite alternate}
@keyframes wv{to{transform:scaleY(.35)}}
.outs{display:flex;gap:10px;align-items:flex-end}
.fr{position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--bg2) 6px 12px)}
.fr .ph{position:absolute;inset:0;background:url(assets/photo.jpg) center/cover;opacity:0;transform:scale(1.12);transition:opacity .6s}
.fr.f45 .ph{background-position:42% 35%;filter:saturate(1.15) contrast(1.05)}
.fr.ready .ph{opacity:1;animation:kb 7s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.22) translate(-3%,2%)}}
.fr .tag{position:absolute;left:5px;top:5px;font-size:7.5px;background:rgba(0,0,0,.55);color:#fff;border-radius:3px;padding:1px 4px;opacity:0;transition:opacity .4s}
.fr.ready .tag{opacity:1}
.fr .lb{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font-size:9px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .4s}
.fr.ready .lb{opacity:1}
.fr .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--faint);transition:opacity .3s}
.fr.ready .wait{opacity:0}
.exp{display:flex;justify-content:space-between;align-items:center;margin-top:9px;color:var(--faint);font-size:10px}
.exp span.b{border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted)}
.node.done .exp span.b{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.insp{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);min-height:58px}
.insp .k{font:11px var(--mono);letter-spacing:.1em;color:var(--accent);text-transform:uppercase;flex:none;min-width:96px}
.insp .v{font-size:14.5px;flex:1}
.insp .btn{flex:none;padding:7px 14px;font-size:13.5px}
@media (max-width:600px){.insp{flex-wrap:wrap}.insp .k{min-width:0}}

/* latent band */
.latent{position:relative;height:190px;margin-top:84px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.latent canvas{position:absolute;inset:0;width:100%;height:100%}
.latent .l{position:absolute;bottom:10px;font:11px var(--mono);letter-spacing:.12em;color:var(--muted)}

/* cases */
.case{display:grid;grid-template-columns:.95fr 1.05fr;gap:44px;padding:40px 0;border-top:1px solid var(--line)}
.case:first-of-type{border-top:0;padding-top:8px}
@media (max-width:880px){.case{grid-template-columns:minmax(0,1fr);gap:20px}}
.case>*,.img2>*,.how>*,.hero .wrap>*{min-width:0}
.case .no{font:12px var(--mono);letter-spacing:.12em;color:var(--accent)}
.case h3{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 8px;font-weight:650}
.case .lead{font-size:17px;color:var(--muted);margin:0 0 12px}
.case ul{margin:0;padding:0;list-style:none}
.case li{position:relative;padding-left:20px;margin:7px 0}
.case li::before{content:"";position:absolute;left:2px;top:.66em;width:8px;height:1.5px;background:var(--accent)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.res div{border-left:2px solid var(--accent);padding:2px 12px}
.res b{display:block;font-size:22px;line-height:1.2;letter-spacing:-.01em;font-weight:600}
.res span{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.tags span{border:1px solid var(--line);border-radius:4px;padding:2px 8px;font:11.5px var(--mono);color:var(--muted)}
.viz{position:sticky;top:76px;align-self:start}
.mgc{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mgc .top{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--muted);letter-spacing:.04em}
.mgc .top .live-dot{color:var(--accent)}
.mgc .cv{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;background-color:var(--bg);padding:12px 10px}
.mg{display:block;width:100%;height:auto;overflow:visible}
@media (max-width:600px){.mgc .cv{overflow-x:auto;-webkit-overflow-scrolling:touch}.mg{min-width:430px}.mgc .top .live-dot{display:none}.mgc .top::after{content:"swipe ↔";color:var(--accent)}}
.mg .n{cursor:pointer}
.mg .n rect.b{fill:var(--card);stroke:var(--line);stroke-width:1;transition:stroke .2s}
.mg .n rect.ib{fill:var(--bg);stroke:var(--line);stroke-width:1;transition:fill .2s,stroke .2s}
.mg .n .ic{fill:none;stroke:var(--muted);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.mg .n text.l{font:500 10.5px var(--mono);fill:var(--ink);letter-spacing:.04em}
.mg .n text.s{font:10.5px var(--sans);fill:var(--muted)}
.mg .n.hl rect.b{stroke:var(--accent);stroke-width:1.4}
.mg .n.hl rect.ib{fill:var(--accent-soft);stroke:var(--accent)}
.mg .n.hl .ic{stroke:var(--accent)}
.mg .p{fill:var(--card);stroke:var(--faint);stroke-width:1.2}
.mg .e{fill:none;stroke:var(--faint);stroke-width:1.3;transition:stroke .2s,opacity .2s}
.mg .e.dash{stroke-dasharray:4 4}
.mg .e.hl{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 5;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
.mg.focus .n:not(.hl){opacity:.55}
.mg.focus .e:not(.hl){opacity:.35}
.mg .n,.mg .e{transition:opacity .25s}
.mgc .ins{display:flex;gap:12px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--line);font-size:14px;min-height:44px}
.mgc .ins b{font:11px var(--mono);letter-spacing:.1em;color:var(--accent);text-transform:uppercase;font-weight:500;flex:none}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:580px){.cards{grid-template-columns:1fr}}
.cardx{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px 16px;transition:border-color .25s}
.cardx:hover{border-color:var(--accent)}
.cardx .hd{display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.cardx .hd i{font-style:normal;color:var(--faint)}
.cardx .ic{height:64px;margin:12px 0 12px;border:1px solid var(--line);border-radius:6px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:12px 12px;background-color:var(--bg)}
.cardx .ic svg{display:block;width:100%;height:100%;overflow:visible}
.cardx .ic *{fill:none;stroke:var(--faint);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,fill .3s}
.cardx .ic svg{stroke:none}
.cardx .ic .f{fill:var(--faint);stroke:none}
.cardx .ic text{fill:var(--muted);stroke:none;font:7.5px var(--mono);letter-spacing:.06em}
.cardx:hover .ic *{stroke:var(--accent)}
.cardx:hover .ic svg{stroke:none}
.cardx:hover .ic .f{fill:var(--accent)}
.cardx:hover .ic text{fill:var(--accent);stroke:none}
.cardx .ic .fl{stroke-dasharray:3 3}
.cardx:hover .ic .fl{animation:flow .6s linear infinite}
.cardx .ic .sw{transform-box:view-box;transform-origin:40px 32px}
.cardx:hover .ic .sw{animation:sweep 2.4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.cardx:hover .ic .bl{animation:blink .5s infinite alternate}
.cardx h5{font-size:16.5px;margin:0 0 4px;letter-spacing:-.01em;font-weight:600}
.cardx p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.cardx a.go{display:inline-block;margin-top:8px;font:12.5px var(--mono)}

/* image */
.img2{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:start}
@media (max-width:880px){.img2{grid-template-columns:minmax(0,1fr)}}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.caps div{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--card)}
.caps b{display:block;font-size:15px;font-weight:600}
.caps span{color:var(--muted);font-size:13.5px}
@media (max-width:480px){.caps{grid-template-columns:1fr}}

/* timeline */
.tl{position:relative;margin-left:8px;border-left:1px solid var(--line)}
.tl .it{position:relative;padding:0 0 28px 28px;display:grid;grid-template-columns:250px 1fr;gap:4px 24px}
@media (max-width:700px){.tl .it{grid-template-columns:1fr}}
.tl .it::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.6px solid var(--faint);transition:border-color .25s,background .25s}
.tl .it:hover::before,.tl .it.now::before{border-color:var(--accent);background:var(--accent)}

/* mini graph */
const CW = 136, CH = 46, CX = 150, CY = 64;
function mgHTML(g) {
  const W = 8 + 2 * CX + CW + 8, H = 10 + (g.rows - 1) * CY + CH + 10;
  const P = {}; g.n.forEach(n => P[n[0]] = {x: 8 + n[1] * CX, y: 10 + n[2] * CY});
  const route = (a, b) => {
    const A = P[a], B = P[b];
    if (B.x >= A.x + CW) { const x1 = A.x + CW, y1 = A.y + CH / 2, x2 = B.x, y2 = B.y + CH / 2, d = Math.max(7, (x2 - x1) / 2); return [x1, y1, x2, y2, `M${x1} ${y1} C${x1 + d} ${y1} ${x2 - d} ${y2} ${x2} ${y2}`]; }
    if (A.x >= B.x + CW && A.y === B.y) { const x1 = A.x, y1 = A.y + CH / 2, x2 = B.x + CW, y2 = B.y + CH / 2; return [x1, y1, x2, y2, `M${x1} ${y1} L${x2} ${y2}`]; }
    if (B.y > A.y) { const x1 = A.x + CW / 2, y1 = A.y + CH, x2 = B.x + CW / 2, y2 = B.y, d = (y2 - y1) / 2; return [x1, y1, x2, y2, `M${x1} ${y1} C${x1} ${y1 + d} ${x2} ${y2 - d} ${x2} ${y2}`]; }
    const x1 = A.x + CW / 2 + 14, y1 = A.y, x2 = B.x + CW / 2 + 14, y2 = B.y + CH, d = (y1 - y2) / 2; return [x1, y1, x2, y2, `M${x1} ${y1} C${x1} ${y1 - d} ${x2} ${y2 + d} ${x2} ${y2}`];
  };
  let s = `<svg class="mg" viewBox="0 0 ${W} ${H}" role="img">`, ports = '';
  g.e.forEach(e => { const r = route(e[0], e[1]); s += `<path class="e${e[2] ? ' dash' : ''}" data-a="${e[0]}" data-b="${e[1]}" d="${r[4]}"/>`; ports += `<circle class="p" cx="${r[0]}" cy="${r[1]}" r="2.6"/><circle class="p" cx="${r[2]}" cy="${r[3]}" r="2.6"/>`; });
  g.n.forEach(n => { const p = P[n[0]];
    s += `<g class="n" data-id="${n[0]}" transform="translate(${p.x},${p.y})"><rect class="b" width="${CW}" height="${CH}" rx="6"/><rect class="ib" x="8" y="10" width="26" height="26" rx="5"/>`
      + `<g transform="translate(13,15)"><path class="ic" d="${IC[n[3]]}"/></g><text class="l" x="42" y="20">${esc(n[4])}</text><text class="s" x="42" y="35">${esc(T(n[5]))}</text></g>`; });
  return s + ports + '</svg>';
}
function mgMount(box, g) {
  box.innerHTML = `<div class="mgc"><div class="top"><span>${esc(g.file)}</span><span class="live-dot">${g.n.length} nodes · ${g.e.length} edges</span></div><div class="cv">${mgHTML(g)}</div><div class="ins"><b></b><span></span></div></div>`;
  const svg = box.querySelector('svg'), ib = box.querySelector('.ins b'), is = box.querySelector('.ins span');
  const ids = g.n.map(n => n[0]); let i = 0, hov = false, timer = null;
  const show = id => {
    const n = g.n.find(x => x[0] === id); svg.classList.add('focus');
    svg.querySelectorAll('.n').forEach(el => el.classList.toggle('hl', el.dataset.id === id || g.e.some(e => (e[0] === id && e[1] === el.dataset.id) || (e[1] === id && e[0] === el.dataset.id))));
    svg.querySelectorAll('.e').forEach(el => el.classList.toggle('hl', el.dataset.a === id || el.dataset.b === id));
    ib.textContent = n[4]; is.textContent = T(n[6]); i = ids.indexOf(id);
  };
  svg.querySelectorAll('.n').forEach(el => { el.addEventListener('mouseenter', () => { hov = true; show(el.dataset.id); }); el.addEventListener('click', () => { hov = true; show(el.dataset.id); }); });
  svg.addEventListener('mouseleave', () => { hov = false; });
  show(ids[0]);
  if (!RM) { const io = new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting && !timer) timer = setInterval(() => { if (!hov) show(ids[(i + 1) % ids.length]); }, 2600);
      if (!en.isIntersecting && timer) { clearInterval(timer); timer = null; } }));
    io.observe(box); box._io = io; box._stop = () => { clearInterval(timer); timer = null; }; }
}

  $('#toolkit').innerHTML = `<div class="json"><div class="jh">toolkit.json</div><pre>{\n` + KIT.map((k, i) => `  <span class="key">"${k[0].en.toLowerCase().replace(/ · /g, '_').replace(/ /g, '_')}"</span>: [${k[1].map(t => `<span class="s">"${esc(t)}"</span>`).join(', ')}]${i < KIT.length - 1 ? ',' : ''}`).join('\n') + `\n}</pre></div>`;

/* reveal + count-up */
let RIO;
function observe() {
  if (RIO) RIO.disconnect();
  RIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); RIO.unobserve(e.target); if (e.target.id === 'stats') countUp(); } }), {threshold: .1});
  document.querySelectorAll('.rv:not(.in)').forEach(el => RIO.observe(el));
}
function countUp() {
  if (RM) return;
  document.querySelectorAll('#stats [data-to]').forEach(el => {
    const to = +el.dataset.to, pre = el.dataset.pre, suf = el.dataset.suf, t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 1400), v = Math.round(to * (1 - Math.pow(1 - k, 3))); el.textContent = pre + fmt(v) + suf; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* hero dot field */
(function dots() {
  const cv = $('#dots'), hero = $('.hero'), ctx = cv.getContext('2d'); let mx = -999, my = -999, W = 0, H = 0, dpr = 1, raf = 0;
  const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = hero.clientWidth; H = hero.clientHeight; cv.width = W * dpr; cv.height = H * dpr; draw(); };
  function draw() {
    raf = 0; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const c1 = css('--line'), c2 = css('--accent'), G = 22;
    for (let y = G / 2; y < H; y += G) for (let x = G / 2; x < W; x += G) {
      const d = Math.hypot(x - mx, y - my), k = Math.max(0, 1 - d / 150);
      ctx.fillStyle = k > .05 ? c2 : c1; ctx.globalAlpha = k > .05 ? .25 + .75 * k : 1;
      ctx.beginPath(); ctx.arc(x, y, 1 + 1.3 * k, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  hero.addEventListener('mousemove', e => { const r = hero.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; if (!raf) raf = requestAnimationFrame(draw); });
  hero.addEventListener('mouseleave', () => { mx = my = -999; if (!raf) raf = requestAnimationFrame(draw); });
  addEventListener('resize', size); window._redrawDots = draw; size();
})();

/* halftone portrait (WebGL): b&w dots everywhere, original colour under the cursor */
(function portrait() {
  const cv = $('#pcv'), fr = $('#pframe');
  const gl = cv.getContext('webgl', {premultipliedAlpha: false});
  if (!gl || !window.PHOTO) { cv.remove(); return; }
  const vs = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const fs = `precision mediump float;varying vec2 uv;uniform sampler2D img;uniform vec2 res;uniform vec2 mouse;uniform float rad;uniform float cell;uniform vec3 bg;uniform vec3 ink;uniform float inv;
  void main(){vec2 px=uv*res;vec2 c=floor(px/cell)*cell+cell*.5;vec2 cu=c/res;vec3 s=texture2D(img,cu).rgb;float l=dot(s,vec3(.299,.587,.114));
  vec2 q=(cu-vec2(.45,.53))/vec2(.31,.47);float subj=1.-smoothstep(.75,1.05,length(q));
  l=smoothstep(.03,.97,l);l=mix(pow(l,1.55),pow(l,.85),inv);float v=mix(1.-l,l,inv);v=mix(v*.45,.08+.92*v,subj);
  float r=v*cell*.62;float d=length(px-c);float m=1.-smoothstep(r-.7,r+.7,d);vec3 ht=mix(bg,ink,m);
  float md=length(px-mouse);float k=1.-smoothstep(rad*.62,rad,md);vec3 o=texture2D(img,uv).rgb;
  float ring=smoothstep(rad-1.2,rad,md)*(1.-smoothstep(rad,rad+1.2,md))*step(1.,rad);
  gl_FragColor=vec4(mix(mix(ht,o,k),ink,ring*.5),1.);}`;

/* live pipeline */
const H = {lay: null, pos: {}, els: {}, scale: 1};
function nodeBody(id) {
  const ph = 'assets/photo.jpg', nar = H.lay === 'narrow';
  if (id === 'img') return `<img class="nimg" src="${ph}" alt=""><div class="nfoot">illia.jpg · 640×640</div>`;
  if (id === 'aud') { let w = ''; for (let i = 0; i < 26; i++) { const h = 20 + Math.round(80 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .45))); w += `<span style="height:${h}%;animation-delay:${(i % 7) * .07}s"></span>`; } return `<div class="wave">${w}</div><div class="nfoot">track.wav · 0:15</div>`; }
  if (id === 'mdl') return `<div class="row">image <b>flux · gemini</b></div><div class="row">video <b>kling · seedance</b></div><div class="row" style="margin:0">voice <b>elevenlabs</b></div>`;
  if (id === 'gen') return `<div class="row">seed <b>017</b></div><div class="row">slots <b>4 parallel</b></div><div class="bar"><i></i></div>`;
  if (id === 'ren') return `<div class="row">engine <b>ffmpeg / ae</b></div><div class="row" style="margin:0">formats <b>9:16 · 4:5</b></div><div class="bar"><i></i></div>`;
  if (id === 'qa') return `<div class="row">frames · audio <b class="qs">—</b></div><div class="row" style="margin:0">retry <b>auto</b></div>`;
  if (id === 'out') { const h = nar ? 174 : 156, w1 = nar ? 98 : 88, w2 = nar ? 139 : 125;
    return `<div class="outs"><div class="fr f916" style="width:${w1}px;height:${h}px"><div class="ph"></div><span class="tag">AI GENERATED</span><span class="wait">waiting…</span><span class="lb">9:16 · 1080×1920</span></div>`
    + `<div class="fr f45" style="width:${w2}px;height:${h}px"><div class="ph"></div><span class="tag">AI GENERATED</span><span class="wait">waiting…</span><span class="lb">4:5 · 1080×1350</span></div></div><div class="exp"><span class="cnt">0 assets</span><span class="b">Export ↗</span></div>`; }
  return '';
}
function heroBuild() {
  const c = $('#canvas'), lay = c.clientWidth < 700 ? 'narrow' : 'wide';
  if (lay !== H.lay) {
    H.lay = lay; const L = HLAY[lay], st = $('#stage'); st.classList.toggle('nar', lay === 'narrow'); st.style.width = L.w + 'px'; st.style.height = L.h + 'px';
    st.querySelectorAll('.node').forEach(n => n.remove()); H.els = {};
    Object.keys(HN).forEach(id => {
      const n = document.createElement('div'); n.className = 'node'; n.dataset.id = id; n.style.width = HN[id].w[lay === 'wide' ? 0 : 1] + 'px';
      n.innerHTML = `<div class="nh"><span class="dot"></span>${ico(HN[id].ic)}${HN[id].head[0]} · <b>${HN[id].head[1]}</b><span class="st">idle</span></div><div class="nb">${nodeBody(id)}</div>` + (['img', 'aud', 'mdl'].includes(id) ? '' : '<i class="port i"></i>') + (id !== 'out' && id !== 'mdl' ? '<i class="port o"></i>' : '');
      st.appendChild(n); H.els[id] = n; H.pos[id] = L.pos[id].slice(); place(id); drag(n);
      n.addEventListener('mouseenter', () => focusNode(id)); n.addEventListener('mouseleave', () => { if (!n.classList.contains('drag')) focusNode(null); });
    });
    const sv = $('#wires'); sv.setAttribute('width', L.w); sv.setAttribute('height', L.h);
    sv.innerHTML = HE.map((e, i) => `<path class="wire${e[2] === 'loop' ? ' loop' : ''}" data-i="${i}"/>`).join('') + HE.map((e, i) => `<circle class="pulse" r="3" data-i="${i}"/>`).join('');
    H.done = false;
  }
  H.scale = Math.min(1, c.clientWidth / HLAY[lay].w); $('#stage').style.transform = `scale(${H.scale})`; c.style.height = HLAY[lay].h * H.scale + 'px';
  wires();
}
function place(id) { const n = H.els[id]; n.style.left = H.pos[id][0] + 'px'; n.style.top = H.pos[id][1] + 'px'; }
function box(id) { const n = H.els[id]; return {x: H.pos[id][0], y: H.pos[id][1], w: n.offsetWidth, h: n.offsetHeight}; }
function hits(id, x, y) {
  const a = H.els[id], w = a.offsetWidth, h = a.offsetHeight, G = 14;
  return Object.keys(H.els).some(k => { if (k === id) return false; const b = box(k); return x < b.x + b.w + G && x + w + G > b.x && y < b.y + b.h + G && y + h + G > b.y; });
}
function wires() {
  const ps = document.querySelectorAll('#wires path'), nar = H.lay === 'narrow';
  HE.forEach((e, i) => {
    const a = box(e[0]), b = box(e[1]); let d;
    if (e[2] === 'loop' && nar) { const x1 = a.x, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2; d = `M${x1} ${y1} C${x1 - 70} ${y1} ${x2 - 70} ${y2} ${x2} ${y2}`; }
    else if (e[2] === 'loop') { const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y + b.h, dy = Math.max(y1, y2) + 46; d = `M${x1} ${y1} C${x1} ${dy} ${x2} ${dy} ${x2} ${y2}`; }
    else if (b.x >= a.x + a.w) { const x1 = a.x + a.w, y1 = a.y + 15, x2 = b.x, y2 = b.y + 15, dx = Math.max(30, Math.abs(x2 - x1) * .5); d = `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`; }
    else { const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y, dy = Math.max(16, (y2 - y1) / 2); d = `M${x1} ${y1} C${x1} ${y1 + dy} ${x2} ${y2 - dy} ${x2} ${y2}`; }

}
function focusNode(id) {

  Object.keys(H.els).forEach(k => H.els[k].classList.toggle('hl', !!id && (k === id || HE.some(e => (e[0] === id && e[1] === k) || (e[1] === id && e[0] === k)))));

}
function heroTexts() {
  const id = H.focus; $('#ik').textContent = id ? HN[id].head[1] : (LANG === 'ru' ? 'инспектор' : 'inspector');
  $('#iv').textContent = id ? T(HN[id].info) : (LANG === 'ru' ? (TOUCH ? 'Нажми на ноду или Run.' : 'Наведи на ноду или нажми Run.') : (TOUCH ? 'Tap a node or press Run.' : 'Hover a node or press Run.'));
  $('#runbtn').textContent = H.running ? (LANG === 'ru' ? '… идёт' : '… running') : (H.done ? (LANG === 'ru' ? '↻ Ещё раз' : '↻ Run again') : '▶ Run');

/* drag with collision: nodes never overlap */
function drag(n) {

}
(function pulses() {
  if (RM) return; let vis = false;
  new IntersectionObserver(es => vis = es[0].isIntersecting).observe($('#canvas'));
  const tick = now => {
    if (vis) { const ps = document.querySelectorAll('#wires path'), cs = document.querySelectorAll('#wires circle');
      ps.forEach((p, i) => { const L = p.getTotalLength(); if (!L) return; const hl = p.classList.contains('hl') || (H.running && H.activeEdge === i);
        const k = ((now * (hl ? .25 : .1) / Math.max(L, 200)) + i * .37) % 1, pt = p.getPointAtLength(k * L);
        cs[i].setAttribute('cx', pt.x); cs[i].setAttribute('cy', pt.y); cs[i].setAttribute('r', hl ? 3.4 : 2.3); cs[i].style.opacity = H.focus && !p.classList.contains('hl') ? .15 : (hl ? 1 : .5); }); }
    requestAnimationFrame(tick);

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function run() {
  if (H.running) return; H.running = true; H.done = false; heroTexts(); $('#runstate').textContent = 'running';
  Object.values(H.els).forEach(n => { n.classList.remove('run', 'done'); n.querySelector('.st').textContent = 'queued'; n.querySelectorAll('.bar i').forEach(b => { b.style.transition = 'none'; b.style.width = '0'; }); });
  H.els.out.querySelectorAll('.fr').forEach(f => f.classList.remove('ready')); H.els.out.querySelector('.cnt').textContent = '0 assets'; H.els.qa.querySelector('.qs').textContent = '—';
  const step = async (id, ms, edge) => {
    const n = H.els[id]; n.classList.add('run'); n.querySelector('.st').textContent = 'running'; if (edge != null) H.activeEdge = edge;
    n.querySelectorAll('.bar i').forEach(b => { void b.offsetWidth; b.style.transition = `width ${ms}ms linear`; b.style.width = '100%'; });
    await sleep(RM ? 60 : ms); n.classList.remove('run'); n.classList.add('done'); n.querySelector('.st').textContent = '✓ done';
  };
  await Promise.all([step('img', 500), step('aud', 650), step('mdl', 450)]);
  await step('gen', 1700, 0); await step('ren', 1300, 2);
  H.els.qa.querySelector('.qs').textContent = 'passed'; await step('qa', 700, 4);
  const o = H.els.out; o.classList.add('run'); o.querySelector('.st').textContent = 'exporting'; H.activeEdge = 5;
  const fs = o.querySelectorAll('.fr'); await sleep(350); fs[0].classList.add('ready'); o.querySelector('.cnt').textContent = '1 asset ready'; await sleep(450); fs[1].classList.add('ready');

$('#runbtn').addEventListener('click', run);

/* latent band */
(function latent() {
  const cv = $('#lcv'), bx = $('#latent'), ctx = cv.getContext('2d'); let W, Hh, dpr, mx = .5, tmx = .5, amp = 1, tamp = 1, vis = false;
  const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = bx.clientWidth; Hh = bx.clientHeight; cv.width = W * dpr; cv.height = Hh * dpr; };
  bx.addEventListener('mousemove', e => { const r = bx.getBoundingClientRect(); tmx = (e.clientX - r.left) / r.width; tamp = 1.35; });
  bx.addEventListener('mouseleave', () => { tmx = .5; tamp = 1; });
  new IntersectionObserver(es => vis = es[0].isIntersecting).observe(bx);
  addEventListener('resize', size); size();
  const N = 34;
  const draw = now => {
    requestAnimationFrame(draw); if (!vis) return;
    mx += (tmx - mx) * .06; amp += (tamp - amp) * .05; const t = RM ? 0 : now * .00035;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, Hh); ctx.strokeStyle = css('--accent'); ctx.lineWidth = 1;
    const cy = Hh / 2, A = Hh * .36;
    for (let i = 0; i < N; i++) {
      const f = i / (N - 1) * 2 - 1; ctx.globalAlpha = .12 + .38 * (1 - Math.abs(f)); ctx.beginPath();
      for (let x = 0; x <= W; x += 6) {
        const u = x / W, env = Math.pow(Math.sin(Math.PI * u), 1.4), g = Math.exp(-Math.pow((u - mx) / .16, 2));
        const y = cy + A * env * (f * .95 * Math.sin(u * 9.4 + t * 2 + f * .6) + .3 * Math.sin(u * 4.7 - t + i * .03)) * (1 + (amp - 1) * g * 2.2);

  };

})();

$('#b_th').onclick = () => { const r = document.documentElement, cur = r.getAttribute('data-theme'), dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme', dark ? 'light' : 'dark'); try { localStorage.setItem('pf-theme', dark ? 'light' : 'dark'); } catch (e) {} retheme(); };

LANG = q === 'ru' ? 'ru' : 'en';
