<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI-ролик от брифа до монтажа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--bg2:#ebe9e3;--card:#fbfaf7;--ink:#1c1d1b;--muted:#5f645c;--faint:#a3a69d;--line:#dad9d0;--accent:#3d6b55;--accent2:#6f9a83;--accent-soft:#e2eae4;
  --canvas:#e9e8e2;--grid:rgba(60,70,60,.07);--node:#fbfaf7;--wire:#8fa898;--run:#c98a2b;--bad:#b0563f;--shadow:0 1px 2px rgba(20,30,20,.05),0 10px 30px rgba(20,40,30,.08);
  --mono:"JetBrains Mono",Consolas,ui-monospace,monospace;--sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111311;--bg2:#171a17;--card:#191c19;--ink:#e7eae4;--muted:#9ba196;--faint:#5e645b;--line:#2b302a;--accent:#8cc3a6;--accent2:#5f957a;--accent-soft:#1d2a22;--canvas:#0d0f0d;--grid:rgba(200,220,200,.05);--node:#1a1d1a;--wire:#4f6b5c;--run:#e0a54a;--bad:#e08a6f;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111311;--bg2:#171a17;--card:#191c19;--ink:#e7eae4;--muted:#9ba196;--faint:#5e645b;--line:#2b302a;--accent:#8cc3a6;--accent2:#5f957a;--accent-soft:#1d2a22;--canvas:#0d0f0d;--grid:rgba(200,220,200,.05);--node:#1a1d1a;--wire:#4f6b5c;--run:#e0a54a;--bad:#e08a6f;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.brand b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg2);border-radius:10px;padding:3px}
.tabs button,.lang button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted)}
.tabs button.on,.lang button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.lang{display:flex;gap:2px;font-family:var(--mono)}
.lang button{padding:6px 8px;font-size:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:36px;align-items:center;padding:44px 0 30px}
.hero.vertical{grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr)}
.kicker{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:40px;line-height:1.1;margin:10px 0 14px;letter-spacing:-.02em}
.lead{color:var(--muted);font-size:16.5px;margin:0 0 18px}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;margin:0 0 16px}
.stats div{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats b{display:block;font-family:var(--sans);font-size:20px;color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);background:var(--card)}
.player{border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.player video{display:block;width:100%;height:auto}
.vertical .player{max-width:360px;margin-left:auto}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px;font-size:14.5px}
section.block{padding:26px 0}
/* граф */
.gpanel{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--canvas);box-shadow:var(--shadow)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d120f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d120f}}
.btn[disabled]{opacity:.55;cursor:default}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
.status b{color:var(--ink);font-weight:500}
.viewport{position:relative;height:700px;overflow:hidden;cursor:grab;touch-action:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.viewport.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.wires path{fill:none;stroke:var(--wire);stroke-width:2}
svg.wires path.live{stroke:var(--run);stroke-dasharray:6 6;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.node{position:absolute;width:258px;background:var(--node);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);user-select:none;transition:border-color .2s,box-shadow .2s}
.node:hover{border-color:var(--accent2)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.node.run{border-color:var(--run)}
.nh{display:flex;align-items:center;gap:8px;padding:9px 11px 7px;cursor:grab}
.num{width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 11px/20px var(--mono);text-align:center;flex:none}
.nt{font-weight:600;font-size:13.5px;line-height:1.2}
.nm{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:0 11px 7px;line-height:1.35}
.port{position:absolute;top:22px;width:10px;height:10px;border-radius:50%;background:var(--node);border:2px solid var(--wire)}
.port.in{left:-6px}.port.out{right:-6px}
.nb{padding:0 9px 9px;position:relative}
.pv{position:relative;border-radius:8px;overflow:hidden;background:var(--bg2);aspect-ratio:16/9}
.pv.tall{aspect-ratio:9/16;width:62%;margin:0 auto}
.pv img,.pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pv .grid3{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pv .grid3 img,.pv .grid3 video{position:static;width:100%;height:100%;object-fit:cover}
.pv .grid4{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pv .grid4 img{position:static;width:100%;height:100%;object-fit:cover}
.pv .empty{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
.bar2{position:absolute;left:0;bottom:0;height:3px;background:var(--run);width:0}
.auds{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.aud{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;background:var(--card)}
.aud:hover{border-color:var(--accent2);color:var(--ink)}
.aud .ic{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:9px;flex:none}
.aud.on .ic{background:var(--run)}
.textbody{font-size:12.5px;color:var(--muted);line-height:1.45}
.textbody q{display:block;color:var(--ink);font-style:italic;margin:3px 0;quotes:none}
.params{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.params span{font-family:var(--mono);font-size:10.5px;background:var(--bg2);border-radius:5px;padding:2px 6px;color:var(--muted)}
.vsel{display:flex;align-items:center;gap:6px;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.vsel select{flex:1;min-width:0;font:inherit;font-size:11px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 4px}
.verdict{font-size:11.5px;margin-top:5px;line-height:1.35}
.ok{color:var(--accent)}.no{color:var(--bad)}
.tag{position:absolute;top:6px;right:6px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:1px 6px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zoom button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.hint{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:11px;color:var(--faint);z-index:5;pointer-events:none}
/* инспектор */
aside.insp{position:absolute;top:53px;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s;z-index:10;overflow:auto;padding:18px 18px 30px}
aside.insp.open{transform:none}
.insp .x{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted)}
.insp h3{margin:0 0 2px;font-size:18px}
.insp .model{font-family:var(--mono);font-size:12px;color:var(--accent);margin:0 0 12px}
.insp h4{font-size:12px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.insp p{margin:0 0 8px;font-size:14px}
.insp .media{display:grid;gap:8px}
.insp .media img,.insp .media video{width:100%;border-radius:8px;display:block;background:#000}
.insp .media audio{width:100%}
.insp .cap{font-size:12px;color:var(--muted);margin-top:-3px}
.iters{display:grid;gap:10px}
.iter{border:1px solid var(--line);border-radius:10px;padding:8px}
.iter .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:4px}
.iter img,.iter video{width:100%;border-radius:6px;display:block}
.cmp{position:relative;border-radius:8px;overflow:hidden;user-select:none;touch-action:none;cursor:ew-resize}
.cmp img{display:block;width:100%}
.cmp .top{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}
.cmp .ln{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.cmp .lb{position:absolute;bottom:8px;font-family:var(--mono);font-size:10.5px;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:5px}
/* микшер */
.mixer{max-width:900px}
.tl{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;position:relative;cursor:pointer}
.tl .shots{display:flex;gap:2px;height:46px;margin-left:122px}
.trk{width:114px;margin-right:8px;flex:none;display:flex;align-items:center;gap:7px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg2);cursor:pointer;font:500 11.5px var(--mono);color:var(--ink);text-align:left}
.trk i{width:8px;height:8px;border-radius:50%;flex:none}
.trk small{margin-left:auto;font-size:9.5px;color:var(--muted)}
.trk.off{color:var(--faint);background:transparent}
.trk.off i{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--faint)}
@media (max-width:600px){.trk{width:86px;padding:0 6px}.trk small{display:none}.tl .shots{margin-left:94px}}
.tl .shots div{position:relative;overflow:hidden;border-radius:4px;background-size:cover;background-position:center}
.tl .shots span{position:absolute;left:4px;bottom:2px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;font-family:var(--mono)}
.tl .row{display:flex;align-items:center;height:30px;margin-top:3px}
.tl canvas{flex:1;height:30px;width:100%}
.tl .ph{position:absolute;top:6px;bottom:6px;width:2px;background:var(--run);pointer-events:none}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px}
.note b{display:block;margin-bottom:4px}
.note p{margin:0;color:var(--muted);font-size:14px}
footer{padding:30px 0 50px;color:var(--faint);font-family:var(--mono);font-size:12px}
@media (max-width:900px){.hero,.hero.vertical,.mixer,.notes{grid-template-columns:1fr}.vertical .player{margin:0 auto}h1{font-size:31px}.viewport{height:540px}.brand{display:none}.tabs{margin-left:0}}
</style>

<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="../" style="text-decoration:none"><b>Illia Ushanau</b> · case</a>

</div></header>
<main class="wrap" id="app"></main>

<script>
const M='media/';
const VOL=.55;   // общая громкость страницы: все плееры стартуют тише
document.addEventListener('play',e=>{const m=e.target;if(m.dataset&&!m.dataset.vol){m.dataset.vol=1;m.volume=VOL}},true);
const L=(ru,en)=>({ru,en});
let lang='ru';try{lang=localStorage.getItem('case-lang')||(location.hash==='#en'?'en':'ru')}catch(e){}
const T=x=>x&&typeof x==='object'&&'ru' in x?x[lang]:x;

const UI={
  run:L('▶ Run','▶ Run'),again:L('▶ Run ещё раз','▶ Run again'),clear:L('Очистить кеш','Clear cache'),fit:L('По размеру','Fit'),
  idle:L('Нажми Run - граф посчитает этапы по порядку','Press Run - the graph computes stages in order'),
  running:L('Считается','Computing'),done:L('Готово','Done'),cache:L('с диска','from disk'),
  gpu:L('на RTX 5070 с нуля','on an RTX 5070 from scratch'),gpuCache:L('повторный запуск: этапы взяты с диска','re-run: stages loaded from disk'),
  hint:L('тяни фон - двигать · клик по ноде - подробности','drag the canvas · click a node for details'),
  what:L('Что делает','What it does'),why:L('Почему так','Why this way'),out:L('Результат','Output'),iters:L('Итерации','Iterations'),
  params:L('Настройки','Settings'),chosen:L('выбрано','chosen'),variant:L('вариант','variant'),
  before:L('до','before'),after:L('после','after'),
  mixer:L('Микшер: монтаж по дорожкам','Mixer: the edit, track by track'),
  mixerSub:L('Звук собран в графе из отдельных дорожек. Включай и выключай их на таймлайне прямо во время просмотра.','The sound is assembled in the graph from separate tracks. Toggle them on the timeline while the video plays.'),
  toggle:L('Включить или выключить дорожку','Mute or unmute the track'),
  graph:L('Пайплайн в ComfyUI','The ComfyUI pipeline'),
  graphSub:L('Это упрощённая карта настоящего графа: каждый блок - этап со своими моделями, внутри - сохранённые результаты и пробы. Нажми Run, чтобы увидеть порядок расчёта.','A simplified map of the real graph: each block is a stage with its models, results and trials. Press Run to watch the order of computation.'),
  how:L('Как устроено','How it is built'),
};

/* ---------- данные: семейная сцена ---------- */
const DIAL=[['Mom','Hey, have you finished your homework?'],['Son','I will, if you beat me in this game.'],['Dad','Seriously? Then let’s see what you can do.']];
const G2={
 key:'t2', tab:L('Семейная сцена','Family scene'),
 kicker:L('AI-ролик · ComfyUI · open-source','AI video · ComfyUI · open-source'),
 title:L('Семейная сцена: от брифа до монтажа','Family scene: from brief to final cut'),
 lead:L('Пять шотов, три героя с диалогом и финал, где вся семья играет на диване. Голоса, кадры, липсинк, анимация, музыка, звуки и монтаж собраны в одном графе ComfyUI на открытых моделях.','Five shots, three characters with dialogue and a finale where the whole family plays together on the sofa. Voices, frames, lip-sync, animation, music, sound effects and the edit all live in one ComfyUI graph built on open models.'),
 stats:[['15.7 s',L('ролик','video')],['5',L('шотов','shots')],['1280×720 · 60 fps','']],
 chips:['Qwen3-TTS','Krea 2','Qwen-Image-Edit','InfiniteTalk','Wan 2.2','RIFE','ESRGAN','ACE-Step','Stable Audio','ChatterBox'],
 hero:{t:'vid',src:'t2/final.mp4',poster:'t2/final.jpg'},
 total:L('≈ 55 мин','≈ 55 min'),
 nodes:[
  {id:'brief',x:0,y:250,n:'0',title:L('Бриф','Brief'),model:L('сюжет и диалог','story and dialogue'),gpu:0,
   text:true,
   what:L('Сын играет на телефоне на диване, мама на кухне за столом, папа работает за ноутбуком. Финал: вся семья вместе на диване, у каждого свой телефон. Реплики должны звучать живо: у сына - весёлый дружеский вызов, у папы - хитрый отеческий азарт.','The son plays on his phone on the sofa, mom is at the kitchen table, dad works on a laptop. Finale: the whole family on the sofa, each with a phone. Lines must sound natural: a playful challenge from the son, a sly fatherly spark from dad.')},
  {id:'voices',x:330,y:20,n:'1',title:L('Голоса','Voices'),model:'Qwen3-TTS VoiceDesign',gpu:1.5,
   out:[{t:'aud',src:'t2/voice_mom.m4a',cap:'Mom'},{t:'aud',src:'t2/voice_son.m4a',cap:'Son'},{t:'aud',src:'t2/voice_dad.m4a',cap:'Dad'}],
   params:['seed 102','3 / 9 takes'],
   what:L('Голос не клонируется с записи, а описывается словами: возраст, тембр, настроение и подача. Так голос подбирается под характер героя.','The voice is not cloned from a recording but described in words: age, timbre, mood and delivery. This way each voice fits the character.'),
   why:L('Из девяти дублей оставил три, где интонация ближе всего к брифу: мама заботливая с подколкой, сын с азартом, папа с хитрой улыбкой в голосе.','Out of nine takes I kept the three closest to the brief: a caring, teasing mom, an excited son, a dad with a sly smile in his voice.')},
  {id:'open',x:330,y:430,n:'2',title:L('Общий план','Opening shot'),model:'Krea 2 Turbo',gpu:0.5,
   out:[{t:'img',src:'t2/open.jpg'}],params:['1920×1088','seed 811','8 steps'],
   what:L('Вся сцена одним промптом: комната и семья сразу - папа в кресле с ноутбуком, мама на кухне, сын на диване с телефоном.','The whole scene from one prompt: room and family at once - dad in the armchair with a laptop, mom in the kitchen, the son on the sofa with his phone.'),
   why:L('Это мастер-кадр: дальше все кадры получаются из него правкой или вырезкой, поэтому герои и комната везде одинаковые. Сборка сцены из отдельных листов героев давала разный фон, масштаб и свет.','This is the master frame: every later frame is an edit or a crop of it, so the characters and the room stay identical. Building the scene from separate character sheets gave mismatched backgrounds, scale and light.')},
  {id:'final',x:660,y:560,n:'3',title:L('Финальный кадр','Final frame'),model:'Qwen-Image-Edit 2511',gpu:1,
   out:[{t:'img',src:'t2/final.jpg'}],params:['1664×944','seed 971','4 steps'],
   what:L('Правка того же общего плана по тексту: папа и мама пересаживаются на диван к сыну, у каждого свой телефон.','A text edit of the same wide shot: mom and dad move to the sofa next to the son, each with a phone.'),

  vp.addEventListener('change',e=>{const s=e.target.closest('select');if(!s)return;vsel[s.dataset.id]=+s.value;rerender(s.dataset.id)});
  vp.addEventListener('click',e=>{const a=e.target.closest('.aud');if(a)playAud(a)});
  $('#insp').addEventListener('click',e=>{const a=e.target.closest('.aud');if(a)playAud(a);if(e.target.closest('.x'))closeInsp()});
}
function zoomAt(k,e){
  const vp=$('#vp'),r=vp.getBoundingClientRect(),cx=e&&e.clientX?e.clientX-r.left:vp.clientWidth/2,cy=e&&e.clientY?e.clientY-r.top:vp.clientHeight/2;
  const s=Math.min(1.6,Math.max(.25,view.s*k));view.x=cx-(cx-view.x)*s/view.s;view.y=cy-(cy-view.y)*s/view.s;view.s=s;apply();
}
function rerender(id){
  const nd=GRAPHS[cur].nodes.find(n=>n.id===id),d=$(`.node[data-id="${id}"]`);d.innerHTML=nodeHTML(nd);setNodeState(id,state[id]);wires();
  if($('#insp').classList.contains('open')&&$('#insp').dataset.id===id)openInsp(id);
}
function playAud(a){
  if(playing.a&&playing.el===a){playing.a.pause();a.classList.remove('on');a.querySelector('.ic').textContent='▶';playing.a=null;return}
  if(playing.a){playing.a.pause();playing.el.classList.remove('on');playing.el.querySelector('.ic').textContent='▶'}
  const au=new Audio(a.dataset.src);au.volume=VOL;au.play();a.classList.add('on');a.querySelector('.ic').textContent='❚❚';playing.a=au;playing.el=a;
  au.onended=()=>{a.classList.remove('on');a.querySelector('.ic').textContent='▶';playing.a=null};
}
/* инспектор */
function bigMedia(o){
  const cap=o.cap&&typeof o.cap!=='object'||o.cap&&'ru' in o.cap?`<div class="cap">${T(o.cap)}</div>`:'';
  if(o.t==='img')return `<img src="${M+o.src}" alt="">${cap}`;
  if(o.t==='vid')return `<video src="${M+o.src}" controls playsinline loop preload="metadata" ${o.tall?'style="max-width:260px;margin:0 auto"':''}></video>${cap}`;
  if(o.t==='aud')return `<div class="aud" data-src="${M+o.src}"><span class="ic">▶</span>${T(o.cap)||''}</div>`;
  if(o.t==='img3'||o.t==='img4'||o.t==='img5')return `<div class="iter"><div class="row">${o.src.map(s=>`<img src="${M+s}" alt="">`).join('')}</div></div>`;
  if(o.t==='vids')return o.src.map((s,i)=>`<video src="${M+s}" controls playsinline preload="metadata"></video><div class="cap">${o.cap[i]}</div>`).join('');
  if(o.t==='cmp')return `<div class="cmp" data-cmp><img src="${M+o.a}" alt=""><div class="top"><img src="${M+o.b}" alt=""></div><div class="ln"></div><span class="lb" style="left:8px">${T(UI.before)}</span><span class="lb" style="right:8px">${T(UI.after)}</span></div><div class="cap">${T(o.cap)}</div>`;
  return '';
}
function openInsp(id){
  const nd=GRAPHS[cur].nodes.find(n=>n.id===id),I=$('#insp');
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel',n.dataset.id===id));
  let h=`<button class="x" aria-label="close">×</button><h3>${T(nd.title)}</h3><div class="model">${T(nd.model)}</div>`;
  if(nd.text)h+=`<div class="textbody" style="font-size:14px">${DIAL.map(d=>`<q>${d[0]}: “${d[1]}”</q>`).join('')}</div>`;
  h+=`<h4>${T(UI.what)}</h4><p>${T(nd.what)}</p>`;
  if(nd.why)h+=`<h4>${T(UI.why)}</h4><p>${T(nd.why)}</p>`;
  if(nd.params)h+=`<h4>${T(UI.params)}</h4><div class="params">${nd.params.map(p=>`<span>${p}</span>`).join('')}</div>`;
  const outs=(nd.out||[]).filter(o=>o.t!=='vid3');
  if(outs.length)h+=`<h4>${T(UI.out)}</h4><div class="media">${outs.map(bigMedia).join('')}</div>`;
  if(nd.variants)h+=`<h4>${T(UI.iters)}</h4><div class="iters">${nd.variants.map(v=>`<div class="iter"><div class="verdict ${v.ok?'ok':'no'}" style="margin:0 0 6px"><b>${v.ok?'✓':'✗'} ${T(v.l)}</b> - ${T(v.v)}</div><div class="media">${v.out.map(bigMedia).join('')}</div></div>`).join('')}</div>`;
  I.innerHTML=h;I.dataset.id=id;I.classList.add('open');I.scrollTop=0;
  I.querySelectorAll('[data-cmp]').forEach(c=>{const f=e=>{const r=c.getBoundingClientRect(),p=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100));c.querySelector('.top').style.clipPath=`inset(0 0 0 ${p}%)`;c.querySelector('.ln').style.left=p+'%'};
    c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')f(e)});c.addEventListener('pointerdown',f)});
}
function closeInsp(){$('#insp').classList.remove('open');document.querySelectorAll('.node').forEach(n=>n.classList.remove('sel'))}
/* запуск */
function setNodeState(id,s){
  state[id]=s;const d=$(`.node[data-id="${id}"]`);if(!d)return;
  d.classList.toggle('run',s==='run');
  const pv=d.querySelector('.pv');if(!pv)return;
  [...pv.children].forEach(c=>{if(!c.classList.contains('bar2')&&!c.classList.contains('empty'))c.style.visibility=s==='queued'?'hidden':''});
  const emp=pv.querySelector('.empty');if(emp){emp.hidden=s!=='queued';emp.textContent='· · ·'}
  d.querySelectorAll('.auds').forEach(a=>a.style.visibility=s==='queued'?'hidden':'');
  const tg=d.querySelector('.tag');if(tg)tg.remove();
  if(s==='done'&&d.dataset.from){const t=el('span','tag',d.dataset.from);pv.appendChild(t)}
}
function setStatus(txt){
  const G=GRAPHS[cur],s=$('#status');if(!s)return;
  s.innerHTML=txt||(cached?`<b>${T(UI.done)}</b> · ${T(UI.gpuCache)}`:`${T(UI.idle)} · <b>${T(G.total)}</b> ${T(UI.gpu)}`);
}
async function run(){
  if(running)return;running=true;closeInsp();const my=++runId;
  const G=GRAPHS[cur],btn=$('#run');btn.disabled=true;
  const fromCache=cached;
  G.order.forEach(id=>{const d=$(`.node[data-id="${id}"]`);delete d.dataset.from;setNodeState(id,'queued')});wires();
  for(const id of G.order){
    const nd=G.nodes.find(n=>n.id===id),d=$(`.node[data-id="${id}"]`),bar=d.querySelector('.bar2');
    setNodeState(id,'run');wires();
    setStatus(`<b>${T(UI.running)}:</b> ${T(nd.title)} · ${T(nd.model)}${fromCache?' · '+T(UI.cache):(nd.gpu?` · ≈ ${nd.gpu<1?'<1':Math.round(nd.gpu)} ${lang==='ru'?'мин':'min'}`:'')}`);
    const dur=fromCache?180:(nd.gpu?600+Math.sqrt(nd.gpu)*450:300);
    if(bar){bar.style.transition='none';bar.style.width='0';bar.offsetWidth;bar.style.transition=`width ${dur}ms linear`;bar.style.width='100%'}
    await new Promise(r=>setTimeout(r,dur));
    if(my!==runId)return;
    if(bar){bar.style.transition='none';bar.style.width='0'}
    if(fromCache&&nd.gpu)d.dataset.from=T(UI.cache);
    setNodeState(id,'done');wires();
  }
  cached=true;running=false;btn.disabled=false;btn.textContent=T(UI.again);setStatus();
}
/* микшер */
const MIX_COL={voices:'#5aa58e',music:'#c46a9c',sfx:'#9aae4a'};
function mixerHTML(){
  const tr=[['voices',L('Голоса','Voices'),'TTS'],['music',L('Музыка','Music'),'ACE'],['sfx',L('Звуки','SFX'),'SA3']];
  return `<section class="block"><h2>${T(UI.mixer)}</h2><p class="sub">${T(UI.mixerSub)}</p><div class="mixer">
   <div class="player"><video id="mv" src="${M}t2/final.mp4" poster="${M}t2/final.jpg" muted playsinline controls preload="metadata"></video></div>
   <div class="tl" id="tl">
   <div class="shots">${[['Opening',3.0167],['Mom',2.6167],['Son',3.1333],['Dad',2.8833],['Final',4.0167]].map((s,i)=>`<div style="flex:${s[1]};background-image:url(${M}t2/shot_${i+1}.jpg)"><span>${s[0]}</span></div>`).join('')}</div>
   ${tr.map(t=>`<div class="row"><button class="trk" data-tr="${t[0]}" title="${T(UI.toggle)}"><i style="background:${MIX_COL[t[0]]}"></i>${T(t[1])}<small>${t[2]}</small></button><canvas data-env="${t[0]}"></canvas></div>`).join('')}<div class="ph" id="ph"></div></div>
  </div></section>`;
}
function initMixer(){
  const v=$('#mv'),names=['voices','music','sfx'];
  const A={};names.forEach(n=>{A[n]=new Audio(`${M}t2/stem_${n}.m4a`);A[n].preload='auto'});
  const mute={};names.forEach(n=>{mute[n]=false});
  const gain=()=>{names.forEach(n=>A[n].volume=mute[n]?0:VOL)};
  const sync=(force)=>{Object.values(A).forEach(a=>{if(force||Math.abs(a.currentTime-v.currentTime)>.08)a.currentTime=v.currentTime})};
  v.addEventListener('play',()=>{sync(true);gain();Object.values(A).forEach(a=>a.play().catch(()=>{}))});
  v.addEventListener('pause',()=>Object.values(A).forEach(a=>a.pause()));
  v.addEventListener('seeked',()=>sync(true));
  v.addEventListener('ended',()=>Object.values(A).forEach(a=>{a.pause();a.currentTime=0}));
  v.addEventListener('timeupdate',()=>{if(!v.paused)sync(false);ph()});
  const tl=$('#tl'),phE=$('#ph');
  tl.querySelectorAll('.trk').forEach(m=>{const n=m.dataset.tr;
    m.onclick=()=>{mute[n]=!mute[n];m.classList.toggle('off',mute[n]);gain();drawEnv()}});
  function ph(){const c=tl.querySelector('canvas');const r=c.getBoundingClientRect(),t=tl.getBoundingClientRect();phE.style.left=(r.left-t.left+(v.currentTime/(v.duration||15.67))*r.width)+'px'}
  tl.addEventListener('click',e=>{if(e.target.closest('button'))return;const c=tl.querySelector('canvas').getBoundingClientRect();const p=(e.clientX-c.left)/c.width;if(p>=0&&p<=1){v.currentTime=p*(v.duration||15.67);ph()}});
  function drawEnv(){
    tl.querySelectorAll('canvas').forEach(c=>{const n=c.dataset.env,e=(window.ENV||{})[n]||[];const w=c.clientWidth,h=c.clientHeight;c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);x.clearRect(0,0,w,h);
      const k=mute[n]?.15:1;x.fillStyle=MIX_COL[n];x.globalAlpha=.25+.75*k;const pk=Math.max(...e,.25);
      e.forEach((a,i)=>{const hh=Math.max(1,a/pk*(h/2-2)*Math.max(k,.15));x.fillRect(i/e.length*w,h/2-hh,Math.max(1,w/e.length-.3),hh*2)})});
  }
  drawEnv();ph();v.addEventListener('loadedmetadata',ph);addEventListener('resize',()=>{drawEnv();ph()});
  v.addEventListener('volumechange',()=>{if(!v.muted)v.muted=true});   // звук идёт дорожками микшера, у самого видео - выключен
  window._drawEnv=drawEnv;
}
/* вкладки и язык */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){cur=t.dataset.tab;try{localStorage.setItem('case-tab',cur)}catch(err){}state={};cached=false;vsel={};build();scrollTo({top:0});return}
  const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem('case-lang',lang)}catch(err){}const s={...state};build();state=s;return}
});
addEventListener('resize',()=>{fit();wires()});
build();
</script>
</body>
